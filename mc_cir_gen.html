<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Circle & Sphere Generator - AS BRO</title>

<style>
:root {
  --bg: #0a0a0a;
  --panel: #111111;
  --panel-2: #161616;
  --panel-border: #3a3a3a;
  --red: #ff3333;
  --red-hover: #cc0000;
  --ink: #ffffff;
  --ink-dim: #d1d5db;
  --font-mono: 'Courier New', Courier, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background-color: var(--bg);
  font-family: var(--font-mono);
  color: var(--ink);
  padding: 30px 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

/* Header */
.header {
  text-align: center;
  margin-bottom: 30px;
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 2rem;
}

.header h1 {
  font-size: 2.4rem;
  color: var(--red);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 10px;
  text-shadow: 2px 2px 0px #000;
}

.header p {
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 1.6;
}

/* Pixel Buttons */
.pixel-btn {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: bold;
  padding: 12px 18px;
  background: var(--panel-2);
  color: var(--ink);
  border: 4px solid var(--panel-border);
  box-shadow: inset -3px -3px 0px 0px #000, inset 3px 3px 0px 0px #444;
  cursor: pointer;
  text-align: center;
  text-transform: uppercase;
  transition: all 0.1s ease;
  user-select: none;
}

.pixel-btn:hover {
  background: #222;
  border-color: #666;
  color: #fff;
}

.pixel-btn:active {
  box-shadow: inset 3px 3px 0px 0px #000, inset -3px -3px 0px 0px #333;
  transform: translateY(2px);
}

.pixel-btn.primary {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -3px -3px 0px 0px #880000, inset 3px 3px 0px 0px #ff9999;
}

.pixel-btn.primary:hover {
  background: var(--red-hover);
}

.pixel-btn.active {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -3px -3px 0px 0px #880000, inset 3px 3px 0px 0px #ff9999;
}

/* Main Layout Grid */
.layout-grid {
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 24px;
}

/* Controls Side Panel */
.controls-panel {
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

.section-title {
  font-size: 15px;
  color: #fff;
  text-transform: uppercase;
  border-bottom: 3px solid var(--panel-border);
  padding-bottom: 8px;
  margin-bottom: 12px;
  letter-spacing: 0.5px;
}

.btn-group {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.btn-group .pixel-btn {
  flex: 1 1 30%;
  padding: 8px 4px;
  font-size: 11px;
}

.control-group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.control-group label {
  font-size: 13px;
  color: var(--ink-dim);
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.control-group input[type="number"],
.control-group input[type="text"],
.control-group select {
  width: 100%;
  padding: 10px;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
}

.control-group input[type="number"]:focus,
.control-group input[type="text"]:focus,
.control-group select:focus {
  border-color: var(--red);
}

/* Custom Range Slider */
.slider-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

input[type="range"] {
  -webkit-appearance: none;
  width: 100%;
  height: 12px;
  background: var(--bg);
  border: 3px solid var(--panel-border);
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 20px;
  height: 24px;
  background: var(--red);
  border: 2px solid #fff;
  cursor: pointer;
  box-shadow: inset -2px -2px 0px 0px #880000;
}

/* Checkbox Styling */
.checkbox-label {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 13px;
  color: #fff;
  cursor: pointer;
  user-select: none;
  font-weight: bold;
}

.checkbox-label input {
  width: 18px;
  height: 18px;
  accent-color: var(--red);
  cursor: pointer;
}

/* Stats Box Top Grid */
.top-stats-bar {
  width: 100%;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 15px;
}

.top-stat-card {
  background: var(--panel-2);
  border: 3px solid var(--panel-border);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
}

.top-stat-card label {
  font-size: 11px;
  color: var(--ink-dim);
}

.top-stat-card span {
  font-size: 18px;
  font-weight: bold;
  color: #fff;
}

/* Preview Canvas Area */
.canvas-panel {
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 1.5rem;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  position: relative;
  min-height: 550px;
}

.canvas-toolbar {
  width: 100%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
  background: var(--panel-2);
  border: 3px solid var(--panel-border);
  padding: 10px 14px;
}

.canvas-container {
  width: 100%;
  height: 520px;
  overflow: hidden;
  position: relative;
  background: #050505;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  cursor: grab;
  display: flex;
  align-items: center;
  justify-content: center;
}

.canvas-container:active {
  cursor: grabbing;
}

canvas {
  image-rendering: pixelated;
  display: block;
}

.coord-tooltip {
  position: absolute;
  bottom: 12px;
  left: 12px;
  background: rgba(0,0,0,0.85);
  border: 2px solid var(--panel-border);
  padding: 6px 12px;
  font-size: 12px;
  color: #fff;
  pointer-events: none;
}

/* Export Panel */
.export-panel {
  width: 100%;
  margin-top: 20px;
  background: var(--panel-2);
  border: 4px solid var(--panel-border);
  padding: 15px;
}

.export-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 10px;
}

.export-textarea {
  width: 100%;
  height: 140px;
  background: var(--bg);
  border: 3px solid var(--panel-border);
  color: var(--ink-dim);
  font-family: var(--font-mono);
  font-size: 12px;
  padding: 10px;
  resize: vertical;
  outline: none;
}

/* Fixed Origin Inputs Grid */
.coords-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  width: 100%;
}

.coords-row input {
  width: 100%;
  text-align: center;
  padding: 8px;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 14px;
  outline: none;
}

.preset-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.preset-grid .pixel-btn {
  font-size: 11px;
  padding: 8px 4px;
}

@media(max-width: 900px) {
  .layout-grid {
    grid-template-columns: 1fr;
  }
  .canvas-container {
    height: 400px;
  }
  .top-stats-bar {
    grid-template-columns: 1fr 1fr;
  }
}
</style>
</head>
<body>

<div class="container">

  <div class="header">
    <h1>CIRCLE & SPHERE GENERATOR</h1>
    <p>Generate exact pixel blueprints for Minecraft circles, ellipses, arches, and 3D spheres.</p>
  </div>

  <div class="layout-grid">

    <!-- Left Controls Panel -->
    <div class="controls-panel">

      <!-- Shape Selection Buttons -->
      <div>
        <div class="section-title">SHAPE</div>
        <div class="btn-group">
          <button class="pixel-btn active" id="btnCircle" onclick="setShapeMode('circle')">Circle</button>
          <button class="pixel-btn" id="btnEllipse" onclick="setShapeMode('ellipse')">Ellipse</button>
          <button class="pixel-btn" id="btnSphere" onclick="setShapeMode('sphere')">Sphere</button>
          <button class="pixel-btn" id="btnCylinder" onclick="setShapeMode('cylinder')">Cylinder</button>
          <button class="pixel-btn" id="btnDome" onclick="setShapeMode('dome')">Dome</button>
          <button class="pixel-btn" id="btnSpiral" onclick="setShapeMode('spiral')">Spiral</button>
        </div>
      </div>

      <!-- Dimensions / Radius Controls -->
      <div>
        <div class="control-group" style="margin-bottom: 12px;">
          <label id="lblRadius">Radius: <span id="valR">10</span> blocks</label>
          <div class="slider-container">
            <input type="range" id="inputR" min="1" max="64" value="10" step="1" oninput="updateDimensions()">
          </div>
        </div>

        <div class="control-group" id="heightGroup" style="display:none; margin-bottom: 12px;">
          <label>Height: <span id="valH">20</span> blocks</label>
          <div class="slider-container">
            <input type="range" id="inputH" min="1" max="64" value="20" step="1" oninput="updateDimensions()">
          </div>
        </div>

        <!-- Arc Dropdown -->
        <div class="control-group" style="margin-bottom: 12px;">
          <label>Arc / partial shape</label>
          <select id="selectArc" onchange="redraw()">
            <option value="full">Full circle</option>
            <option value="top">Top half (Arch)</option>
            <option value="bottom">Bottom half</option>
            <option value="left">Left half</option>
            <option value="right">Right half</option>
            <option value="quarter">Quarter arc</option>
          </select>
        </div>
      </div>

      <!-- Toggles -->
      <div>
        <div class="control-group" style="margin-bottom: 10px;">
          <label class="checkbox-label">
            <span>Hollow</span>
            <input type="checkbox" id="checkHollow" checked onchange="toggleThicknessControl()">
          </label>
        </div>

        <div class="control-group" id="thicknessGroup" style="margin-bottom: 10px;">
          <label>Wall thickness: <span id="valThickness">1</span></label>
          <div class="slider-container">
            <input type="range" id="inputThickness" min="1" max="10" value="1" step="1" oninput="updateThickness()">
          </div>
        </div>

        <div class="control-group" style="margin-bottom: 10px;">
          <label class="checkbox-label">
            <span>Show grid</span>
            <input type="checkbox" id="checkGrid" checked onchange="redraw()">
          </label>
        </div>

        <div class="control-group" style="margin-bottom: 10px;">
          <label class="checkbox-label">
            <span>Number edges #</span>
            <input type="checkbox" id="checkNumberEdges" checked onchange="redraw()">
          </label>
        </div>

        <div class="control-group" style="margin-bottom: 12px;">
          <label>Preview block</label>
          <select id="selectBlock" onchange="redraw()">
            <option value="#ff3333">Stone (Red)</option>
            <option value="#8b8b8b">Stone (Gray)</option>
            <option value="#795548">Wood Plank</option>
            <option value="#5c6bc0">Lapis / Glass</option>
            <option value="#333333">Obsidian</option>
          </select>
        </div>
      </div>

      <!-- 3D Layer Controls -->
      <div id="sphereControls" style="display: none;">
        <div class="section-title">3D LAYER</div>
        <div class="control-group">
          <label>Current Layer (Y): <span id="valLayer">10 / 21</span></label>
          <div class="slider-container">
            <input type="range" id="inputLayer" min="1" max="21" value="10" oninput="redraw()">
          </div>
        </div>
      </div>

      <!-- Build Origin Coordinates -->
      <div>
        <div class="section-title">BUILD ORIGIN</div>
        <div class="coords-row">
          <input type="text" id="origX" value="~" oninput="redraw()" placeholder="X">
          <input type="text" id="origY" value="~" oninput="redraw()" placeholder="Y">
          <input type="text" id="origZ" value="~" oninput="redraw()" placeholder="Z">
        </div>
        <p style="font-size: 10px; color: var(--ink-dim); margin-top: 6px;">Use ~ for relative coords from your standing position.</p>
      </div>

      <!-- Presets -->
      <div>
        <div class="section-title">PRESETS</div>
        <div class="preset-grid">
          <button class="pixel-btn" onclick="applyPreset('tower')">Tower ring r=10</button>
          <button class="pixel-btn" onclick="applyPreset('arch')">Arch (top half)</button>
          <button class="pixel-btn" onclick="applyPreset('glass')">Glass sphere r=15</button>
          <button class="pixel-btn" onclick="applyPreset('arena')">Arena 20x15</button>
          <button class="pixel-btn" onclick="applyPreset('obsidian')">Obsidian ring r=5</button>
          <button class="pixel-btn" onclick="applyPreset('spiral')">Spiral tower</button>
        </div>
      </div>

    </div>

    <!-- Right Preview Panel -->
    <div class="canvas-panel">

      <!-- Top Stats Bar -->
      <div class="top-stats-bar">
        <div class="top-stat-card">
          <label>This layer</label>
          <span id="statThisLayer">0</span>
        </div>
        <div class="top-stat-card">
          <label>Edge blocks</label>
          <span id="statEdgeBlocks">0</span>
        </div>
        <div class="top-stat-card">
          <label>Total blocks</label>
          <span id="statTotalBlocks">0</span>
        </div>
        <div class="top-stat-card">
          <label>Layers</label>
          <span id="statLayers">1</span>
        </div>
      </div>

      <div class="canvas-toolbar">
        <div style="display: flex; gap: 8px;">
          <button class="pixel-btn" style="padding: 6px 10px; font-size: 11px;" onclick="adjustZoom(1.2)">Zoom in</button>
          <button class="pixel-btn" style="padding: 6px 10px; font-size: 11px;" onclick="adjustZoom(1/1.2)">Zoom out</button>
          <button class="pixel-btn" style="padding: 6px 10px; font-size: 11px;" onclick="resetView()">Reset view</button>
        </div>
        <div style="display: flex; gap: 8px;">
          <button class="pixel-btn" style="padding: 6px 10px; font-size: 11px;" onclick="downloadPNG()">PNG</button>
          <button class="pixel-btn" style="padding: 6px 10px; font-size: 11px;" onclick="copyExportText()">Share</button>
        </div>
      </div>

      <div class="canvas-container" id="canvasContainer">
        <canvas id="gridCanvas"></canvas>
        <div class="coord-tooltip" id="coordTooltip">Ctrl+scroll to zoom - drag to pan</div>
      </div>

      <!-- Export Text Section -->
      <div class="export-panel">
        <div class="export-header">
          <span style="font-weight: bold; font-size: 14px;">Export</span>
          <button class="pixel-btn" style="padding: 4px 10px; font-size: 11px;" onclick="copyExportText()">This layer</button>
        </div>
        <textarea class="export-textarea" id="exportOutput" readonly></textarea>
      </div>

    </div>

  </div>

</div>

<script>
let shapeMode = 'circle';
let radius = 10;
let radiusY = 10;
let height = 20;
let wallThickness = 1;

// Canvas Pan & Zoom
let zoom = 16;
let panX = 0;
let panY = 0;
let isDragging = false;
let startX = 0, startY = 0;

const canvas = document.getElementById('gridCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('canvasContainer');

function initCanvas() {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  resetView();
}

window.addEventListener('resize', () => {
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;
  redraw();
});

function adjustZoom(factor) {
  zoom = Math.max(4, Math.min(zoom * factor, 64));
  redraw();
}

function resetView() {
  const dim = radius * 2 + 3;
  zoom = Math.min(canvas.width / dim, canvas.height / dim);
  zoom = Math.max(8, Math.min(zoom, 32));
  panX = canvas.width / 2;
  panY = canvas.height / 2;
  redraw();
}

function setShapeMode(mode) {
  shapeMode = mode;
  ['btnCircle', 'btnEllipse', 'btnSphere', 'btnCylinder', 'btnDome', 'btnSpiral'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.classList.remove('active');
  });
  
  const capMode = mode.charAt(0).toUpperCase() + mode.slice(1);
  const activeBtn = document.getElementById('btn' + capMode);
  if (activeBtn) activeBtn.classList.add('active');

  const sphereControls = document.getElementById('sphereControls');
  const heightGroup = document.getElementById('heightGroup');
  const lblRadius = document.getElementById('lblRadius');

  if (mode === 'ellipse') {
    heightGroup.style.display = 'block';
    sphereControls.style.display = 'none';
    lblRadius.innerText = `Radius X: ${radius}`;
  } else if (mode === 'sphere' || mode === 'dome' || mode === 'cylinder' || mode === 'spiral') {
    sphereControls.style.display = 'block';
    heightGroup.style.display = (mode === 'cylinder' || mode === 'spiral') ? 'block' : 'none';
    lblRadius.innerText = `Radius: ${radius} blocks`;
    updateSphereLayerBounds();
  } else {
    sphereControls.style.display = 'none';
    heightGroup.style.display = 'none';
    lblRadius.innerText = `Radius: ${radius} blocks`;
  }
  redraw();
}

function updateDimensions() {
  radius = parseInt(document.getElementById('inputR').value);
  document.getElementById('valR').innerText = radius;
  
  const lblRadius = document.getElementById('lblRadius');
  if (shapeMode === 'ellipse') {
    lblRadius.innerText = `Radius X: ${radius}`;
  } else {
    lblRadius.innerText = `Radius: ${radius} blocks`;
  }

  if (shapeMode === 'ellipse' || shapeMode === 'cylinder' || shapeMode === 'spiral') {
    height = parseInt(document.getElementById('inputH').value);
    radiusY = height;
    document.getElementById('valH').innerText = height;
  } else {
    radiusY = radius;
  }

  if (shapeMode === 'sphere' || shapeMode === 'dome' || shapeMode === 'cylinder' || shapeMode === 'spiral') {
    updateSphereLayerBounds();
  }

  redraw();
}

function toggleThicknessControl() {
  const isHollow = document.getElementById('checkHollow').checked;
  const thickGroup = document.getElementById('thicknessGroup');
  thickGroup.style.display = isHollow ? 'flex' : 'none';
  redraw();
}

function updateThickness() {
  wallThickness = parseInt(document.getElementById('inputThickness').value);
  document.getElementById('valThickness').innerText = wallThickness;
  redraw();
}

function updateSphereLayerBounds() {
  const layerInput = document.getElementById('inputLayer');
  let maxLayers = radius * 2 + 1;
  if (shapeMode === 'dome') maxLayers = radius + 1;
  if (shapeMode === 'cylinder' || shapeMode === 'spiral') maxLayers = height;

  layerInput.max = maxLayers;
  if (parseInt(layerInput.value) > maxLayers) layerInput.value = Math.ceil(maxLayers / 2);
}

function getSphereSliceRadius(r, layerIdx) {
  if (shapeMode === 'cylinder') return r;
  let dy = (layerIdx - 0.5) - r;
  if (shapeMode === 'dome') dy = layerIdx - 1;
  return Math.sqrt(Math.max(0, r * r - dy * dy));
}

function generateGrid() {
  const rx = radius;
  const ry = (shapeMode === 'ellipse') ? radiusY : radius;
  const W = rx * 2 + 1;
  const H = ry * 2 + 1;

  const isHollow = document.getElementById('checkHollow').checked;
  const arcType = document.getElementById('selectArc').value;

  let currentRx = rx;
  let currentRy = ry;

  if (shapeMode === 'sphere' || shapeMode === 'dome' || shapeMode === 'cylinder') {
    const layerIdx = parseInt(document.getElementById('inputLayer').value);
    const sR = getSphereSliceRadius(radius, layerIdx);
    currentRx = sR;
    currentRy = sR;
  } else if (shapeMode === 'spiral') {
    const layerIdx = parseInt(document.getElementById('inputLayer').value);
    currentRx = Math.max(1, radius * (layerIdx / height));
    currentRy = currentRx;
  }

  const grid = Array(H).fill(0).map(() => Array(W).fill(false));
  const cx = rx;
  const cy = ry;

  const innerRx = Math.max(0.1, currentRx - wallThickness);
  const innerRy = Math.max(0.1, currentRy - wallThickness);

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - cx;
      const dy = y - cy;

      // Arc filtering
      if (arcType === 'top' && dy > 0) continue;
      if (arcType === 'bottom' && dy < 0) continue;
      if (arcType === 'left' && dx > 0) continue;
      if (arcType === 'right' && dx < 0) continue;
      if (arcType === 'quarter' && (dx > 0 || dy > 0)) continue;

      const outerVal = (dx * dx) / (currentRx * currentRx || 1) + (dy * dy) / (currentRy * currentRy || 1);

      if (!isHollow) {
        if (outerVal <= 1.05) grid[y][x] = true;
      } else {
        const innerVal = (dx * dx) / (innerRx * innerRx || 1) + (dy * dy) / (innerRy * innerRy || 1);
        if (outerVal <= 1.05 && innerVal >= 0.82) {
          grid[y][x] = true;
        }
      }
    }
  }
  return { grid, W, H, cx, cy };
}

function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const { grid, W, H, cx, cy } = generateGrid();
  const showGrid = document.getElementById('checkGrid').checked;
  const numberEdges = document.getElementById('checkNumberEdges').checked;
  const blockColor = document.getElementById('selectBlock').value;

  let thisLayerBlocks = 0;
  let edgeBlocksList = [];

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (grid[y][x]) {
        thisLayerBlocks++;
        // Check surrounding blocks to confirm if edge
        let isEdge = false;
        const neighbors = [[0,1],[0,-1],[1,0],[-1,0]];
        for (let [dx, dy] of neighbors) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || nx >= W || ny < 0 || ny >= H || !grid[ny][nx]) {
            isEdge = true;
            break;
          }
        }
        if (isEdge) {
          edgeBlocksList.push({ x, y });
        }
      }
    }
  }

  // Exact Clockwise Perimeter Numbering (1 to N) starting from Top (12 o'clock)
  edgeBlocksList.sort((a, b) => {
    let angleA = Math.atan2(a.y - cy, a.x - cx) + Math.PI / 2;
    let angleB = Math.atan2(b.y - cy, b.x - cx) + Math.PI / 2;
    if (angleA < 0) angleA += Math.PI * 2;
    if (angleB < 0) angleB += Math.PI * 2;
    return angleA - angleB;
  });

  const edgeMap = {};
  edgeBlocksList.forEach((item, idx) => {
    edgeMap[`${item.x}_${item.y}`] = idx + 1;
  });

  let totalLayersCount = 1;
  if (shapeMode === 'sphere') totalLayersCount = radius * 2 + 1;
  else if (shapeMode === 'dome') totalLayersCount = radius + 1;
  else if (shapeMode === 'cylinder' || shapeMode === 'spiral') totalLayersCount = height;

  document.getElementById('statThisLayer').innerText = thisLayerBlocks;
  document.getElementById('statEdgeBlocks').innerText = edgeBlocksList.length;
  document.getElementById('statTotalBlocks').innerText = thisLayerBlocks * totalLayersCount;
  document.getElementById('statLayers').innerText = totalLayersCount;

  if (shapeMode === 'sphere' || shapeMode === 'dome' || shapeMode === 'cylinder' || shapeMode === 'spiral') {
    const layerIdx = document.getElementById('inputLayer').value;
    document.getElementById('valLayer').innerText = `${layerIdx} / ${totalLayersCount}`;
  }

  // Draw Blocks & Grid Canvas
  const startX = panX - (W * zoom) / 2;
  const startY = panY - (H * zoom) / 2;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const bx = startX + x * zoom;
      const by = startY + y * zoom;

      if (grid[y][x]) {
        ctx.fillStyle = blockColor;
        ctx.fillRect(bx, by, zoom - 1, zoom - 1);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.fillRect(bx, by, zoom - 1, 2);

        if (numberEdges && edgeMap[`${x}_${y}`]) {
          ctx.fillStyle = '#ffffff';
          ctx.font = `bold ${Math.max(8, zoom * 0.38)}px sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(edgeMap[`${x}_${y}`], bx + zoom / 2, by + zoom / 2);
        }
      } else {
        ctx.fillStyle = '#111111';
        ctx.fillRect(bx, by, zoom - 1, zoom - 1);
        if (showGrid) {
          ctx.strokeStyle = '#1d1d1d';
          ctx.strokeRect(bx, by, zoom, zoom);
        }
      }
    }
  }

  // Center Axis Crosshair
  ctx.strokeStyle = '#555555';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  const centerX = startX + (cx + 0.5) * zoom;
  const centerY = startY + (cy + 0.5) * zoom;
  ctx.moveTo(centerX, startY);
  ctx.lineTo(centerX, startY + H * zoom);
  ctx.moveTo(startX, centerY);
  ctx.lineTo(startX + W * zoom, centerY);
  ctx.stroke();

  updateExportText(grid, W, H, cx, cy, thisLayerBlocks, edgeBlocksList.length);
}

function updateExportText(grid, W, H, cx, cy, layerBlocks, edgeBlocks) {
  const ox = document.getElementById('origX').value || '~';
  const oy = document.getElementById('origY').value || '~';
  const oz = document.getElementById('origZ').value || '~';

  const isHollow = document.getElementById('checkHollow').checked;
  let text = `Shape: ${shapeMode} | Hollow: ${isHollow ? 'yes' : 'no'}\n`;
  text += `Layer blocks: ${layerBlocks} | Edge blocks: ${edgeBlocks}\n\n`;
  text += `# Relative coordinates (Y layer offset 0 for 3D shapes)\n`;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (grid[y][x]) {
        const relX = x - Math.floor(cx);
        const relZ = y - Math.floor(cy);
        const strX = relX >= 0 ? `+${relX}` : `${relX}`;
        const strZ = relZ >= 0 ? `+${relZ}` : `${relZ}`;

        let coordX = ox === '~' ? `~${strX}` : parseInt(ox) + relX;
        let coordY = oy;
        let coordZ = oz === '~' ? `~${strZ}` : parseInt(oz) + relZ;

        text += `${coordX} ${coordY} ${coordZ}\n`;
      }
    }
  }
  document.getElementById('exportOutput').value = text;
}

function copyExportText() {
  const copyText = document.getElementById('exportOutput');
  copyText.select();
  navigator.clipboard.writeText(copyText.value);
}

function applyPreset(type) {
  if (type === 'tower') {
    setShapeMode('circle');
    document.getElementById('inputR').value = 10;
    document.getElementById('checkHollow').checked = true;
    document.getElementById('selectArc').value = 'full';
  } else if (type === 'arch') {
    setShapeMode('circle');
    document.getElementById('inputR').value = 12;
    document.getElementById('selectArc').value = 'top';
  } else if (type === 'glass') {
    setShapeMode('sphere');
    document.getElementById('inputR').value = 15;
    document.getElementById('checkHollow').checked = true;
  } else if (type === 'arena') {
    setShapeMode('ellipse');
    document.getElementById('inputR').value = 20;
    document.getElementById('inputH').value = 15;
  } else if (type === 'obsidian') {
    setShapeMode('circle');
    document.getElementById('inputR').value = 5;
    document.getElementById('selectBlock').value = '#333333';
  } else if (type === 'spiral') {
    setShapeMode('spiral');
    document.getElementById('inputR').value = 12;
    document.getElementById('inputH').value = 24;
  }
  updateDimensions();
  toggleThicknessControl();
}

// Canvas Drag / Zoom Interactions
container.addEventListener('mousedown', (e) => {
  isDragging = true;
  startX = e.clientX - panX;
  startY = e.clientY - panY;
});

window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    panX = e.clientX - startX;
    panY = e.clientY - startY;
    redraw();
  }
});

window.addEventListener('mouseup', () => isDragging = false);

container.addEventListener('wheel', (e) => {
  e.preventDefault();
  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  adjustZoom(zoomFactor);
}, { passive: false });

function downloadPNG() {
  const exportCanvas = document.createElement('canvas');
  const expCtx = exportCanvas.getContext('2d');
  const scale = 20;

  const { grid, W, H } = generateGrid();
  exportCanvas.width = W * scale;
  exportCanvas.height = H * scale;

  const blockColor = document.getElementById('selectBlock').value;

  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (grid[y][x]) {
        expCtx.fillStyle = blockColor;
        expCtx.fillRect(x * scale, y * scale, scale - 1, scale - 1);
      } else {
        expCtx.fillStyle = '#111111';
        expCtx.fillRect(x * scale, y * scale, scale - 1, scale - 1);
      }
    }
  }

  const link = document.createElement('a');
  link.download = `minecraft_${shapeMode}_layer.png`;
  link.href = exportCanvas.toDataURL();
  link.click();
}

// Initial Canvas Boot
initCanvas();
</script>
