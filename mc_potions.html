<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Potion Guide - AS BRO</title>

<style>

:root {
  --bg: #0a0a0a;
  --panel: #111111;
  --panel-2: #161616;
  --panel-border: #3a3a3a;
  --red: #ff3333;
  --red-hover: #cc0000;
  --ink: #ffffff;
  --ink-dim: #d1d5db;
  --font-mono: 'Courier New', Courier, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  min-height: 100vh;
  background-color: var(--bg);
  font-family: var(--font-mono);
  color: var(--ink);
  padding: 40px 20px;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
}

/* Header Section */
.header {
  text-align: center;
  margin-bottom: 35px;
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 2.5rem;
}

.header h1 {
  font-size: 2.6rem;
  color: var(--red);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 12px;
  text-shadow: 2px 2px 0px #000;
}

.header p {
  color: var(--ink-dim);
  font-size: 16px;
  line-height: 1.6;
}

/* Base Pixel Button System */
.pixel-btn {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: bold;
  padding: 14px 20px;
  background: var(--panel-2);
  color: var(--ink);
  border: 4px solid var(--panel-border);
  box-shadow: inset -3px -3px 0px 0px #000, inset 3px 3px 0px 0px #444;
  cursor: pointer;
  text-align: center;
  text-transform: uppercase;
  transition: all 0.1s ease;
  user-select: none;
}

.pixel-btn:hover {
  background: #222;
  border-color: #666;
  color: #fff;
}

.pixel-btn:active {
  box-shadow: inset 3px 3px 0px 0px #000, inset -3px -3px 0px 0px #333;
  transform: translateY(2px);
}

.pixel-btn.active {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -3px -3px 0px 0px #880000, inset 3px 3px 0px 0px #ff9999;
}

/* Search and Controls Box */
.controls-panel {
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 1.5rem;
  margin-bottom: 35px;
}

.search-box input {
  width: 100%;
  padding: 16px 18px;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 16px;
  outline: none;
  margin-bottom: 16px;
}

.search-box input:focus {
  border-color: var(--red);
}

.filter-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* Cards Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 20px;
}

.card {
  background: var(--panel-2);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #222;
  padding: 1.6rem;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: all 0.1s ease;
}

.card:hover {
  border-color: var(--red);
  transform: translateY(-3px);
}

.card h2 {
  font-size: 1.4rem;
  color: #ffffff;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.card p {
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 1.6;
  margin-bottom: 20px;
}

.badge {
  display: inline-block;
  align-self: flex-start;
  font-size: 13px;
  font-weight: bold;
  padding: 6px 12px;
  background: #000000;
  border: 3px solid var(--panel-border);
  color: var(--red);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Modal Overlay */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.92);
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  z-index: 1000;
}

.modal-content {
  width: 100%;
  max-width: 750px;
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #444;
  padding: 2.2rem;
  position: relative;
  max-height: 90vh;
  overflow-y: auto;
}

.close-btn {
  position: absolute;
  right: 18px;
  top: 18px;
  width: 40px;
  height: 40px;
  line-height: 32px;
  padding: 0;
  font-size: 18px;
}

.modal-title {
  font-size: 2rem;
  color: var(--red);
  margin-bottom: 12px;
  text-transform: uppercase;
  padding-right: 50px;
  text-shadow: 1px 1px 0px #000;
}

.modal-desc {
  color: #ffffff !important;
  font-size: 16px;
  line-height: 1.6;
}

.section {
  margin-top: 24px;
  background: var(--panel-2);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #222;
  padding: 1.2rem;
}

.section h3 {
  margin-bottom: 14px;
  color: #ffffff;
  font-size: 15px;
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 3px solid var(--panel-border);
  padding-bottom: 8px;
}

.ingredients-list, .steps-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.item {
  background: #050505;
  border: 3px solid var(--panel-border);
  box-shadow: inset 2px 2px 0px 0px #000;
  padding: 12px 16px;
  font-size: 15px;
  color: #ffffff;
  line-height: 1.6;
}

.upgrades-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.tip {
  margin-top: 24px;
  padding: 16px;
  border: 3px dashed #666;
  background: #1a1a1a;
  color: #ffffff;
  font-size: 14px;
  line-height: 1.6;
}

.tip strong {
  color: var(--red);
}

@media(max-width: 600px) {
  .header h1 {
    font-size: 2rem;
  }
  .upgrades-grid {
    grid-template-columns: 1fr;
  }
  .filter-group .pixel-btn {
    flex: 1 1 45%;
  }
}

</style>

const grid = document.getElementById('potionsGrid');
const searchInput = document.getElementById('searchInput');
let currentTierFilter = 'ALL';

function renderPotions(list) {
    grid.innerHTML = '';
    list.forEach(potion => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <div>
                <h2>${potion.name}</h2>
                <p>${potion.effect}</p>
            </div>
            <div class="badge">${potion.tier}</div>
        `;
        card.onclick = () => openPotion(potion);
        grid.appendChild(card);
    });
}

function openPotion(potion) {
    document.getElementById('modal').style.display = 'flex';
    document.getElementById('modalTitle').innerText = potion.name;
    document.getElementById('modalDescription').innerText = potion.effect;

    const ingredientsList = document.getElementById('ingredientsList');
    const stepsList = document.getElementById('stepsList');
    const upgradesList = document.getElementById('upgradesList');

    ingredientsList.innerHTML = '';
    stepsList.innerHTML = '';
    upgradesList.innerHTML = '';

    potion.ingredients.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = '• ' + item;
        ingredientsList.appendChild(div);
    });

    potion.steps.forEach((step, idx) => {
        const div = document.createElement('div');
        div.className = 'item';
        div.innerText = `${idx + 1}. ${step}`;
        stepsList.appendChild(div);
    });

    if(potion.upgrades) {
        upgradesList.innerHTML = `
            <div class="item"><strong style="color:var(--red);">🔴 Redstone:</strong> ${potion.upgrades.redstone || 'N/A'}</div>
            <div class="item"><strong style="color:#ffcc00;">🟡 Glowstone:</strong> ${potion.upgrades.glowstone || 'N/A'}</div>
            <div class="item" style="grid-column: span 2;"><strong style="color:#ffffff;">💥 Splash / Area:</strong> ${potion.upgrades.splash || 'Add Gunpowder'}</div>
        `;
    }

    document.getElementById('tipBox').innerHTML = '<strong>💡 TIP:</strong> ' + potion.tip;
}

function closeModal() {
    document.getElementById('modal').style.display = 'none';
}

function filterTier(tier, btn) {
    currentTierFilter = tier;
    document.querySelectorAll('.filter-group .pixel-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
}

function applyFilters() {
    const query = searchInput.value.toLowerCase();
    const filtered = potions.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(query) || p.effect.toLowerCase().includes(query);
        const matchesTier = (currentTierFilter === 'ALL') || (p.tier === currentTierFilter);
        return matchesSearch && matchesTier;
    });
    renderPotions(filtered);
}

searchInput.addEventListener('input', applyFilters);

// Initial render
renderPotions(potions);
</script>
