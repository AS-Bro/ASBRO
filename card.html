<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Memory Card Match</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap');

/* Minecraft Pixel Cursor */
body {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="square"><path fill="%23000000" d="M3 3v16l4-4 3 7 4-2-3-7 6-1L3 3z"/></svg>') 0 0, auto;
}

button, .memory-card {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ffaa00" stroke-width="2" stroke-linecap="square"><path fill="%23ffaa00" d="M3 3v16l4-4 3 7 4-2-3-7 6-1L3 3z"/></svg>') 0 0, pointer;
}

:root {
  --void: #0a0a0a;
  --panel: #141414;
  --panel-2: #1c1c1c;
  --panel-border: #3a3a3a;
  --red: #ff0033;
  --gold: #ffcc00;
  --ink: #f5f5f0;
  --ink-dim: #a4a49c;
  --online: #3ddc84;
  --font-display: 'Press Start 2P', monospace;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}

.game-container {
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -3px -3px 0 rgba(0,0,0,0.55), 6px 6px 0 rgba(0,0,0,0.5);
  padding: 32px 24px;
  width: 100%;
  max-width: 620px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.game-title {
  font-family: var(--font-display);
  font-size: clamp(16px, 4vw, 22px);
  color: var(--gold);
  text-shadow: 2px 2px #000;
  margin-bottom: 8px;
  text-align: center;
}

.game-subtitle {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 24px;
  text-align: center;
}

/* Replace .card or .tile with your actual container class name */
.card img, 
.tile img {
  width: 100%;
  height: 100%;
  object-fit: contain; /* Keeps pixel aspect ratio clean */
  image-rendering: pixelated; /* Essential for crisp Minecraft style */
  display: block;
}
/* Controls Header */
.memory-controls {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 24px;
}

.memory-stats {
  display: flex;
  gap: 12px;
}

.stat-box {
  background: var(--panel-2);
  border: 2px solid var(--panel-border);
  padding: 8px 12px;
  font-size: 13px;
  font-weight: 700;
}

.stat-box span { color: var(--gold); }

.memory-buttons {
  display: flex;
  gap: 8px;
}

.pixel-btn {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 12px;
  text-transform: uppercase;
  padding: 10px 14px;
  border: 3px solid;
  background: var(--panel-2);
  color: var(--ink);
  border-color: var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -3px -3px 0 rgba(0,0,0,0.5), 3px 3px 0 rgba(0,0,0,0.4);
  transition: transform 0.08s ease;
}

.pixel-btn:hover { transform: translate(-2px, -2px); }

.pixel-btn.primary {
  background: var(--red);
  color: #fff;
  border-color: #ff5c7a;
}

.pixel-btn.gold {
  background: var(--gold);
  color: #1a1400;
  border-color: #ffe680;
}

/* Board Grid */
.memory-grid {
  display: grid;
  gap: 10px;
  justify-content: center;
  perspective: 1000px;
  width: 100%;
}

.memory-grid.grid-4 {
  grid-template-columns: repeat(4, clamp(60px, 18vw, 95px));
}

.memory-grid.grid-6 {
  grid-template-columns: repeat(6, clamp(42px, 12vw, 75px));
}

/* Cards */
.memory-card {
  aspect-ratio: 1 / 1;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.4s ease;
}

.memory-card.flipped {
  transform: rotateY(180deg);
}

.memory-card-face {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.08), inset -3px -3px 0 rgba(0,0,0,0.6);
}

.memory-card-front {
  background: var(--panel-2);
  color: var(--red);
  font-family: var(--font-display);
  font-size: clamp(16px, 3.5vw, 24px);
  user-select: none;
}

.memory-card-front::after {
  content: "?";
}

.memory-card-back {
  background: #222222;
  transform: rotateY(180deg);
  border-color: var(--gold);
}

.memory-card-back svg {
  width: 60%;
  height: 60%;
}

.memory-card.matched .memory-card-back {
  border-color: var(--online);
  background: #142e18;
  animation: pulse 0.3s ease;
}

@keyframes pulse {
  0% { transform: rotateY(180deg) scale(1); }
  50% { transform: rotateY(180deg) scale(1.08); }
  100% { transform: rotateY(180deg) scale(1); }
}

/* Win Banner */
.win-message {
  display: none;
  margin-top: 20px;
  font-family: var(--font-display);
  font-size: 13px;
  color: var(--online);
  text-shadow: 2px 2px #000;
  text-align: center;
  animation: bounce 0.6s ease infinite alternate;
}

@keyframes bounce {
  from { transform: translateY(0); }
  to { transform: translateY(-4px); }
}
</style>
</head>
<body>

<div class="game-container">
  <h1 class="game-title">ITEM MATCH</h1>
  <p class="game-subtitle">Match all pixelated Minecraft item pairs!</p>

  <div class="memory-controls">
    <div class="memory-stats">
      <div class="stat-box">MOVES: <span id="mem-moves">0</span></div>
      <div class="stat-box">TIME: <span id="mem-timer">00:00</span></div>
    </div>
    <div class="memory-buttons">
      <button class="pixel-btn primary" id="btn-4x4" onclick="initGame(4)">4x4</button>
      <button class="pixel-btn" id="btn-6x6" onclick="initGame(6)">6x6</button>
      <button class="pixel-btn gold" onclick="resetGame()">Restart</button>
    </div>
  </div>

  <div class="memory-grid grid-4" id="memory-grid"></div>

  <div class="win-message" id="win-message">🎉 VICTORY! ALL ITEMS MATCHED! 🎉</div>
</div>

<script>
const ITEM_ICONS = [
  { id: 'pickaxe', svg: '<img src="images/icons/pickaxe.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'diamond', svg: '<img src="images/icons/diamond.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'sword',   svg: '<img src="images/icons/sword.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'apple',   svg: '<img src="images/icons/apple.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'tnt',     svg: '<img src="images/icons/tnt.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'eye',     svg: '<img src="images/icons/eye.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'axe',     svg: '<img src="images/icons/axe.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'chest',   svg: '<img src="images/icons/chest.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'potion',  svg: '<img src="images/icons/potion.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'bow',     svg: '<img src="images/icons/bow.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'book',    svg: '<img src="images/icons/book.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'star',    svg: '<img src="images/icons/star.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'shield',  svg: '<img src="images/icons/shield.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'emerald', svg: '<img src="images/icons/emerald.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'bed',     svg: '<img src="images/icons/bed.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'compass', svg: '<img src="images/icons/compass.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'clock',   svg: '<img src="images/icons/clock.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' },
  { id: 'helmet',  svg: '<img src="images/icons/helmet.png" style="width:100%; height:100%; object-fit:contain; image-rendering:pixelated;" />' }
];

let gridSize = 4;
let flippedCards = [];
let matchedPairs = 0;
let moves = 0;
let timerInterval = null;
let seconds = 0;
let gameStarted = false;

function createElement(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}

function initGame(size = 4) {
  gridSize = size;
  const totalCards = size * size;
  const neededPairs = totalCards / 2;

  document.getElementById("btn-4x4").className = `pixel-btn ${size === 4 ? 'primary' : ''}`;
  document.getElementById("btn-6x6").className = `pixel-btn ${size === 6 ? 'primary' : ''}`;

  const gridEl = document.getElementById("memory-grid");
  gridEl.className = `memory-grid grid-${size}`;
  gridEl.innerHTML = "";

  document.getElementById("win-message").style.display = "none";

  moves = 0;
  matchedPairs = 0;
  seconds = 0;
  gameStarted = false;
  clearInterval(timerInterval);
  timerInterval = null;

  document.getElementById("mem-moves").textContent = moves;
  document.getElementById("mem-timer").textContent = "00:00";

  const selectedIcons = ITEM_ICONS.slice(0, neededPairs);
  const deck = [...selectedIcons, ...selectedIcons].sort(() => Math.random() - 0.5);

  deck.forEach((item, idx) => {
    const card = createElement(`
      <div class="memory-card" data-id="${item.id}">
        <div class="memory-card-face memory-card-front"></div>
        <div class="memory-card-face memory-card-back">${item.svg}</div>
      </div>
    `);
    card.addEventListener("click", () => handleCardClick(card));
    gridEl.appendChild(card);
  });
}

function handleCardClick(card) {
  if (!gameStarted && moves === 0 && flippedCards.length === 0) {
    startTimer();
    gameStarted = true;
  }

  if (flippedCards.length >= 2 || card.classList.contains("flipped") || card.classList.contains("matched")) {
    return;
  }

  card.classList.add("flipped");
  flippedCards.push(card);

  if (flippedCards.length === 2) {
    moves++;
    document.getElementById("mem-moves").textContent = moves;
    checkMatch();
  }
}

function checkMatch() {
  const [card1, card2] = flippedCards;
  const isMatch = card1.dataset.id === card2.dataset.id;

  if (isMatch) {
    card1.classList.add("matched");
    card2.classList.add("matched");
    matchedPairs++;
    flippedCards = [];

    if (matchedPairs === (gridSize * gridSize) / 2) {
      clearInterval(timerInterval);
      gameStarted = false;
      document.getElementById("win-message").style.display = "block";
    }
  } else {
    setTimeout(() => {
      card1.classList.remove("flipped");
      card2.classList.remove("flipped");
      flippedCards = [];
    }, 800);
  }
}

function startTimer() {
  clearInterval(timerInterval);
  seconds = 0;
  timerInterval = setInterval(() => {
    seconds++;
    const m = String(Math.floor(seconds / 60)).padStart(2, '0');
    const s = String(seconds % 60).padStart(2, '0');
    document.getElementById("mem-timer").textContent = `${m}:${s}`;
  }, 1000);
}

function resetGame() {
  initGame(gridSize);
}

// Start Game
initGame(4);
</script>
</body>
</html>
