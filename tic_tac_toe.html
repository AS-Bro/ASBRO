<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minecraft Tic-Tac-Toe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap');

/* Minecraft Pixel Cursor */
body {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ffffff" stroke-width="2" stroke-linecap="square"><path fill="%23000000" d="M3 3v16l4-4 3 7 4-2-3-7 6-1L3 3z"/></svg>') 0 0, auto;
}

button, .ttt-cell {
  cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="%23ffaa00" stroke-width="2" stroke-linecap="square"><path fill="%23ffaa00" d="M3 3v16l4-4 3 7 4-2-3-7 6-1L3 3z"/></svg>') 0 0, pointer;
}

:root {
  --void: #0a0a0a;
  --panel: #141414;
  --panel-2: #1c1c1c;
  --panel-border: #3a3a3a;
  --red: #ff0033;
  --gold: #ffcc00;
  --ink: #f5f5f0;
  --ink-dim: #a4a49c;
  --online: #3ddc84;
  --font-display: 'Press Start 2P', monospace;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--void);
  color: var(--ink);
  font-family: var(--font-mono);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-image: repeating-linear-gradient(0deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 3px);
}

.game-container {
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -3px -3px 0 rgba(0,0,0,0.55), 6px 6px 0 rgba(0,0,0,0.5);
  padding: 32px 24px;
  width: 100%;
  max-width: 520px;
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
}

.game-title {
  font-family: var(--font-display);
  font-size: clamp(16px, 4vw, 22px);
  color: var(--gold);
  text-shadow: 2px 2px #000;
  margin-bottom: 8px;
  text-align: center;
}

.game-subtitle {
  font-size: 13px;
  color: var(--ink-dim);
  margin-bottom: 24px;
  text-align: center;
}

/* Controls Header */
.controls {
  width: 100%;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.stats {
  display: flex;
  gap: 10px;
}

.stat-box {
  background: var(--panel-2);
  border: 2px solid var(--panel-border);
  padding: 8px 12px;
  font-size: 12px;
  font-weight: 700;
}

.stat-box span { color: var(--gold); }

.button-group {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.pixel-btn {
  font-family: var(--font-mono);
  font-weight: 700;
  font-size: 11px;
  text-transform: uppercase;
  padding: 10px 14px;
  border: 3px solid;
  background: var(--panel-2);
  color: var(--ink);
  border-color: var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(255,255,255,0.06), inset -3px -3px 0 rgba(0,0,0,0.5), 3px 3px 0 rgba(0,0,0,0.4);
  transition: transform 0.08s ease;
}

.pixel-btn:hover { transform: translate(-2px, -2px); }

.pixel-btn.primary {
  background: var(--red);
  color: #fff;
  border-color: #ff5c7a;
}

.pixel-btn.gold {
  background: var(--gold);
  color: #1a1400;
  border-color: #ffe680;
}

/* Status Bar */
.ttt-status {
  width: 100%;
  text-align: center;
  font-family: var(--font-display);
  font-size: clamp(11px, 2.6vw, 14px);
  color: var(--gold);
  background: var(--panel-2);
  border: 2px solid var(--panel-border);
  padding: 12px;
  margin-bottom: 22px;
  text-shadow: 2px 2px #000;
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease;
}

.ttt-status.status-win {
  color: var(--online);
  border-color: var(--online);
  background: #142e18;
  animation: statusPulse 0.6s ease infinite alternate;
}

.ttt-status.status-draw {
  color: var(--gold);
  border-color: var(--gold);
}

.ttt-status.status-bot {
  color: var(--red);
  animation: statusPulse 0.6s ease infinite alternate;
}

@keyframes statusPulse {
  from { text-shadow: 2px 2px #000, 0 0 4px currentColor; }
  to { text-shadow: 2px 2px #000, 0 0 12px currentColor; }
}

/* Board */
.ttt-grid {
  display: grid;
  grid-template-columns: repeat(3, clamp(72px, 22vw, 110px));
  grid-template-rows: repeat(3, clamp(72px, 22vw, 110px));
  gap: 8px;
  justify-content: center;
  background: #0d0d0d;
  padding: 10px;
  border: 3px solid var(--panel-border);
  box-shadow: inset 2px 2px 0 rgba(0,0,0,0.8);
}

.ttt-grid.locked .ttt-cell {
  cursor: not-allowed;
}

.ttt-cell {
  background:
    radial-gradient(circle at 30% 25%, rgba(255,255,255,0.04), transparent 55%),
    linear-gradient(160deg, #1e1e1e, #141414 70%);
  border: 2px solid #2a2a2a;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.05), inset -2px -2px 0 rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  user-select: none;
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

.ttt-cell:hover {
  border-color: #555;
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -2px -2px 0 rgba(0,0,0,0.6), 0 0 8px rgba(255,204,0,0.18);
}

.ttt-cell.win-cell {
  border-color: var(--online);
  box-shadow: inset 1px 1px 0 rgba(255,255,255,0.08), inset -2px -2px 0 rgba(0,0,0,0.6), 0 0 14px rgba(61,220,132,0.55);
  background:
    radial-gradient(circle at 50% 45%, rgba(61,220,132,0.18), transparent 65%),
    linear-gradient(160deg, #1c3a22, #0f2013 70%);
}

.ttt-mark {
  width: 68%;
  height: 68%;
  object-fit: contain;
  animation: markPop 0.22s ease;
  image-rendering: pixelated;
}

@keyframes markPop {
  from { transform: scale(0.4); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* Fallback glyphs if images/cross.png or images/circle.png are missing */
.ttt-fallback {
  position: absolute;
  width: 60%;
  height: 60%;
  display: none;
  align-items: center;
  justify-content: center;
  animation: markPop 0.22s ease;
}

.ttt-fallback-x::before,
.ttt-fallback-x::after {
  content: "";
  position: absolute;
  width: 85%;
  height: 16%;
  background: var(--red);
  box-shadow: 0 0 6px rgba(255,0,51,0.6);
}

.ttt-fallback-x::before { transform: rotate(45deg); }
.ttt-fallback-x::after { transform: rotate(-45deg); }

.ttt-fallback-o {
  border: 8px solid #4dd8ff;
  border-radius: 50%;
  width: 62%;
  height: 62%;
  box-shadow: 0 0 8px rgba(77,216,255,0.55), inset 0 0 8px rgba(77,216,255,0.35);
}

/* Sparkle particles spawned on a win */
.ttt-spark {
  position: absolute;
  pointer-events: none;
  font-family: var(--font-display), monospace;
  font-size: 10px;
  color: var(--online);
  z-index: 5;
  animation: sparkFly 0.7s ease-out forwards;
}

@keyframes sparkFly {
  0% { transform: translate(0, 0) scale(1); opacity: 1; }
  100% { transform: translate(var(--sx), var(--sy)) scale(0.3); opacity: 0; }
}
</style>
</head>
<body>

<div class="game-container">
  <h1 class="game-title">TIC-TAC-TOE</h1>
  <p class="game-subtitle">Get three pixel pieces in a row to win!</p>

  <div class="controls">
    <div class="stats">
      <div class="stat-box">MODE: <span id="lbl-mode">1P</span></div>
      <div class="stat-box">TURN: <span id="lbl-turn">X</span></div>
    </div>
    <div class="button-group">
      <button class="pixel-btn primary" id="btn-1p" onclick="setMode(1)">1 PLAYER (VS BOT)</button>
      <button class="pixel-btn" id="btn-2p" onclick="setMode(2)">2 PLAYERS</button>
      <button class="pixel-btn gold" onclick="resetGame()">Reset</button>
    </div>
  </div>

  <div class="ttt-status" id="ttt-status">PLAYER X'S TURN</div>

  <div class="ttt-grid" id="ttt-grid"></div>
</div>

<script>
const WIN_LINES = [
  [0,1,2], [3,4,5], [6,7,8], // rows
  [0,3,6], [1,4,7], [2,5,8], // columns
  [0,4,8], [2,4,6]           // diagonals
];

const HUMAN = 'X';
const BOT = 'O';

let mode = 1; // 1 = vs Bot, 2 = Pass & Play
let board = Array(9).fill(null);
let currentPlayer = HUMAN;
let gameOver = false;
let locked = false;

function createCell(idx) {
  const cell = document.createElement('div');
  cell.className = 'ttt-cell';
  cell.dataset.idx = idx;
  cell.addEventListener('click', () => handleCellClick(idx));
  return cell;
}

function renderGrid() {
  const gridEl = document.getElementById('ttt-grid');
  gridEl.innerHTML = '';
  for (let i = 0; i < 9; i++) {
    gridEl.appendChild(createCell(i));
  }
}

function markHTML(symbol) {
  const src = symbol === HUMAN ? 'images/icons/cross.png' : 'images/icons/circle.png';
  const fallbackClass = symbol === HUMAN ? 'ttt-fallback-x' : 'ttt-fallback-o';
  return `
    <img src="${src}" alt="${symbol}" class="ttt-mark"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="ttt-fallback ${fallbackClass}"></div>
  `;
}

function paintCell(idx, symbol) {
  const cell = document.querySelector(`.ttt-cell[data-idx="${idx}"]`);
  if (cell) cell.innerHTML = markHTML(symbol);
}

function setStatus(text, mood) {
  const el = document.getElementById('ttt-status');
  el.textContent = text;
  el.className = 'ttt-status' + (mood ? ` status-${mood}` : '');
}

function updateTurnLabel() {
  document.getElementById('lbl-turn').textContent = currentPlayer;
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-1p').className = `pixel-btn ${m === 1 ? 'primary' : ''}`;
  document.getElementById('btn-2p').className = `pixel-btn ${m === 2 ? 'primary' : ''}`;
  document.getElementById('lbl-mode').textContent = m === 1 ? '1P' : '2P';
  resetGame();
}

function resetGame() {
  board = Array(9).fill(null);
  currentPlayer = HUMAN;
  gameOver = false;
  locked = false;
  document.getElementById('ttt-grid').classList.remove('locked');
  updateTurnLabel();
  setStatus("PLAYER X'S TURN");
  renderGrid();
}

function handleCellClick(idx) {
  if (gameOver || locked) return;
  if (board[idx]) return;
  if (mode === 1 && currentPlayer === BOT) return; // ignore clicks during bot's turn

  makeMove(idx, currentPlayer);

  if (checkEnd()) return;

  switchPlayer();

  if (mode === 1 && currentPlayer === BOT) {
    locked = true;
    document.getElementById('ttt-grid').classList.add('locked');
    setStatus('BOT IS THINKING...', 'bot');
    setTimeout(() => {
      botMove();
      locked = false;
      document.getElementById('ttt-grid').classList.remove('locked');
    }, 600);
  }
}

function makeMove(idx, symbol) {
  board[idx] = symbol;
  paintCell(idx, symbol);
}

function switchPlayer() {
  currentPlayer = currentPlayer === HUMAN ? BOT : HUMAN;
  updateTurnLabel();
}

function checkEnd() {
  const line = getWinningLine();
  if (line) {
    gameOver = true;
    highlightWin(line);
    const winner = board[line[0]];
    if (mode === 1 && winner === BOT) {
      setStatus('BOT WINS! TRY AGAIN?', 'bot');
    } else {
      setStatus(`PLAYER ${winner} WINS!`, 'win');
      spawnSparkles(line);
    }
    return true;
  }

  if (board.every(cell => cell !== null)) {
    gameOver = true;
    setStatus("IT'S A DRAW!", 'draw');
    return true;
  }

  setStatus(`PLAYER ${currentPlayer}'S TURN`);
  return false;
}

function getWinningLine() {
  for (const line of WIN_LINES) {
    const [a, b, c] = line;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      return line;
    }
  }
  return null;
}

function highlightWin(line) {
  line.forEach(idx => {
    const cell = document.querySelector(`.ttt-cell[data-idx="${idx}"]`);
    if (cell) cell.classList.add('win-cell');
  });
}

function spawnSparkles(line) {
  const container = document.querySelector('.game-container');
  line.forEach(idx => {
    const cell = document.querySelector(`.ttt-cell[data-idx="${idx}"]`);
    if (!cell || !container) return;
    const rect = cell.getBoundingClientRect();
    const containerRect = container.getBoundingClientRect();
    const originX = rect.left - containerRect.left + rect.width / 2;
    const originY = rect.top - containerRect.top + rect.height / 2;

    for (let i = 0; i < 5; i++) {
      const spark = document.createElement('span');
      spark.className = 'ttt-spark';
      spark.textContent = ['✦', '✧', '★'][Math.floor(Math.random() * 3)];
      spark.style.left = `${originX}px`;
      spark.style.top = `${originY}px`;
      const angle = Math.random() * Math.PI * 2;
      const dist = 26 + Math.random() * 22;
      spark.style.setProperty('--sx', `${Math.cos(angle) * dist}px`);
      spark.style.setProperty('--sy', `${Math.sin(angle) * dist}px`);
      container.appendChild(spark);
      setTimeout(() => spark.remove(), 720);
    }
  });
}

// -------------------------
// Smart Bot AI
// -------------------------
function getBotMove() {
  // 1. Take a winning move if one exists
  let move = findTacticalMove(BOT);
  if (move !== null) return move;

  // 2. Block the human's winning move if they have one
  move = findTacticalMove(HUMAN);
  if (move !== null) return move;

  // 3. Take the center if it's open
  if (!board[4]) return 4;

  // 4. Take a corner if one is open
  const corners = [0, 2, 6, 8].filter(i => !board[i]);
  if (corners.length) return corners[Math.floor(Math.random() * corners.length)];

  // 5. Take any remaining open cell (edges)
  const openCells = board.map((v, i) => v ? null : i).filter(i => i !== null);
  return openCells[Math.floor(Math.random() * openCells.length)];
}

function findTacticalMove(symbol) {
  for (const line of WIN_LINES) {
    const cells = line.map(i => board[i]);
    const emptyIdx = line[cells.indexOf(null)];
    const filledCount = cells.filter(v => v === symbol).length;
    const emptyCount = cells.filter(v => v === null).length;
    if (filledCount === 2 && emptyCount === 1) {
      return emptyIdx;
    }
  }
  return null;
}

function botMove() {
  if (gameOver) return;
  const idx = getBotMove();
  if (idx === undefined || idx === null) return;

  makeMove(idx, BOT);

  if (checkEnd()) return;

  switchPlayer();
}

// Start Game
setMode(1);
</script>
</body>
</html>
