<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Minecraft Nether Converter - AS BRO</title>

<style>

:root {
  --bg: #0a0a0a;
  --panel: #111111;
  --panel-2: #161616;
  --panel-border: #3a3a3a;
  --red: #ff3333;
  --red-hover: #cc0000;
  --ink: #ffffff;
  --ink-dim: #d1d5db; /* High-contrast light text */
  --font-mono: 'Courier New', Courier, monospace;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 30px 20px;
  background-color: var(--bg);
  font-family: var(--font-mono);
  color: var(--ink);
}

.container {
  width: 100%;
  max-width: 750px;
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 2.5rem;
}

h1 {
  margin: 0;
  font-size: 2.2rem;
  text-align: center;
  color: var(--red);
  letter-spacing: 1px;
  text-transform: uppercase;
  text-shadow: 2px 2px 0px #000;
}

.subtitle {
  margin-top: 12px;
  text-align: center;
  color: var(--ink-dim);
  font-size: 15px;
  line-height: 1.6;
}

/* Base Pixel Button System */
.pixel-btn {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: bold;
  padding: 14px 20px;
  background: var(--panel-2);
  color: var(--ink);
  border: 4px solid var(--panel-border);
  box-shadow: inset -3px -3px 0px 0px #000, inset 3px 3px 0px 0px #444;
  cursor: pointer;
  text-align: center;
  text-transform: uppercase;
  transition: all 0.1s ease;
  user-select: none;
  display: inline-block;
  width: 100%;
}

.pixel-btn:hover {
  background: #222;
  border-color: #666;
  color: #fff;
}

.pixel-btn:active {
  box-shadow: inset 3px 3px 0px 0px #000, inset -3px -3px 0px 0px #333;
  transform: translateY(2px);
}

/* Primary Button State (Red Accent) */
.pixel-btn.primary {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -3px -3px 0px 0px #880000, inset 3px 3px 0px 0px #ff9999;
}

.pixel-btn.primary:hover {
  background: var(--red-hover);
  border-color: #ff4444;
}

/* Secondary Button State */
.pixel-btn.secondary {
  background: transparent;
  color: var(--ink-dim);
  border-color: var(--panel-border);
}

.pixel-btn.secondary:hover {
  color: var(--ink);
  background: var(--panel-2);
}

.mode-switch {
  margin-top: 2rem;
  display: flex;
  gap: 14px;
}

.mode-switch .pixel-btn.active {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -3px -3px 0px 0px #880000, inset 3px 3px 0px 0px #ff9999;
}

.panel {
  margin-top: 1.5rem;
  background: var(--panel-2);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #222;
  padding: 1.5rem;
}

.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.input-group label {
  display: block;
  margin-bottom: 8px;
  color: var(--ink-dim);
  font-size: 13px;
  font-weight: bold;
}

.input-group input {
  width: 100%;
  padding: 14px;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-mono);
  font-size: 16px;
  outline: none;
}

.input-group input:focus {
  border-color: var(--red);
}

.convert-btn {
  margin-top: 1.5rem;
  font-size: 16px;
  padding: 16px;
}

.result-card {
  margin-top: 1.5rem;
  background: var(--panel-2);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #222;
  padding: 1.5rem;
}

.result-title {
  color: #ffffff;
  font-size: 14px;
  margin-bottom: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: bold;
}

.coords {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.coord-box {
  background: var(--bg);
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  padding: 16px;
  text-align: center;
}

.coord-box span {
  display: block;
  color: var(--red);
  font-size: 14px;
  font-weight: bold;
  margin-bottom: 6px;
}

.coord-box strong {
  font-size: 1.6rem;
  color: var(--ink);
}

.actions {
  margin-top: 1.5rem;
  display: flex;
  gap: 14px;
}

.info {
  margin-top: 1.5rem;
  padding: 14px 18px;
  border: 3px dashed var(--panel-border);
  background: var(--panel-2);
  color: #ffffff;
  font-size: 14px;
  line-height: 1.6;
}

.info strong {
  color: var(--red);
}

@media(max-width: 600px) {
  h1 {
    font-size: 1.8rem;
  }
  .grid, .coords {
    grid-template-columns: 1fr;
  }
  .mode-switch, .actions {
    flex-direction: column;
  }
}

</style>
</head>

<body>

<div class="container">

    <h1>// COORD CONVERTER</h1>

    <div class="subtitle">
        Convert Nether coordinates to Overworld coordinates and vice versa instantly.
    </div>

    <div class="mode-switch">
        <button class="pixel-btn active" id="netherBtn">
          NETHER → OVERWORLD
        </button>
        <button class="pixel-btn" id="overworldBtn">
          OVERWORLD → NETHER
        </button>
    </div>

    <div class="panel">
        <div class="grid">
            <div class="input-group">
                <label>X COORD</label>
                <input type="number" id="xInput" placeholder="0">
            </div>

            <div class="input-group">
                <label>Y COORD</label>
                <input type="number" id="yInput" placeholder="64">
            </div>

            <div class="input-group">
                <label>Z COORD</label>
                <input type="number" id="zInput" placeholder="0">
            </div>
        </div>

        <button class="pixel-btn primary convert-btn" id="convertBtn">
            CONVERT
        </button>
    </div>

    <div class="result-card">
        <div class="result-title">
            // CONVERTED RESULT
        </div>

        <div class="coords">
            <div class="coord-box">
                <span>X</span>
                <strong id="resultX">0</strong>
            </div>

            <div class="coord-box">
                <span>Y</span>
                <strong id="resultY">64</strong>
            </div>

            <div class="coord-box">
                <span>Z</span>
                <strong id="resultZ">0</strong>
            </div>
        </div>

        <div class="actions">
            <button class="pixel-btn primary" id="copyBtn">
                COPY COORDS
            </button>
            <button class="pixel-btn secondary" id="clearBtn">
                CLEAR
            </button>
        </div>
    </div>

    <div class="info">
        💡 <strong>8:1 Ratio:</strong> Nether → Overworld (×8) | Overworld → Nether (÷8)
    </div>

</div>

<script>
const netherBtn = document.getElementById('netherBtn');
const overworldBtn = document.getElementById('overworldBtn');

const xInput = document.getElementById('xInput');
const yInput = document.getElementById('yInput');
const zInput = document.getElementById('zInput');

const resultX = document.getElementById('resultX');
const resultY = document.getElementById('resultY');
const resultZ = document.getElementById('resultZ');

const convertBtn = document.getElementById('convertBtn');
const copyBtn = document.getElementById('copyBtn');
const clearBtn = document.getElementById('clearBtn');

let mode = "netherToOverworld";

netherBtn.addEventListener('click', () => {
    mode = "netherToOverworld";
    netherBtn.classList.add('active');
    overworldBtn.classList.remove('active');
});

overworldBtn.addEventListener('click', () => {
    mode = "overworldToNether";
    overworldBtn.classList.add('active');
    netherBtn.classList.remove('active');
});

convertBtn.addEventListener('click', () => {
    const x = parseFloat(xInput.value) || 0;
    const y = parseFloat(yInput.value) || 64;
    const z = parseFloat(zInput.value) || 0;

    let convertedX = mode === "netherToOverworld" ? x * 8 : x / 8;
    let convertedZ = mode === "netherToOverworld" ? z * 8 : z / 8;

    resultX.textContent = Math.round(convertedX);
    resultY.textContent = Math.round(y);
    resultZ.textContent = Math.round(convertedZ);
});

copyBtn.addEventListener('click', async () => {
    const coords = `X: ${resultX.textContent}, Y: ${resultY.textContent}, Z: ${resultZ.textContent}`;
    try {
        await navigator.clipboard.writeText(coords);
        copyBtn.textContent = "COPIED!";
        setTimeout(() => {
            copyBtn.textContent = "COPY COORDS";
        }, 2000);
    } catch(err) {
        alert("Failed to copy");
    }
});

clearBtn.addEventListener('click', () => {
    xInput.value = '';
    yInput.value = '';
    zInput.value = '';
    resultX.textContent = '0';
    resultY.textContent = '64';
    resultZ.textContent = '0';
});
</script>

</body>
</html>
