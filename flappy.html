<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ender Dragon Dodge - AS BRO Mini Games</title>

<style>
:root {
  --bg: #0a0a0a;
  --panel: #111111;
  --panel-2: #161616;
  --panel-border: #3a3a3a;
  --red: #ff3333;
  --red-hover: #cc0000;
  --gold: #fbc531;
  --purple: #a855f7;
  --ink: #ffffff;
  --ink-dim: #d1d5db;
  --font-mono: 'Courier New', Courier, monospace;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background-color: var(--bg);
  font-family: var(--font-mono);
  color: var(--ink);
  padding: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-user-select: none;
}

.game-container {
  width: 100%;
  max-width: 480px;
  background: var(--panel);
  border: 4px solid var(--panel-border);
  box-shadow: inset -4px -4px 0px 0px #000, inset 4px 4px 0px 0px #333;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.header {
  text-align: center;
  border-bottom: 3px solid var(--panel-border);
  padding-bottom: 8px;
}

.header h1 {
  font-size: 1.5rem;
  color: var(--purple);
  text-transform: uppercase;
  text-shadow: 2px 2px 0px #000;
  letter-spacing: 1px;
}

.header p {
  font-size: 11px;
  color: var(--ink-dim);
  margin-top: 4px;
}

/* Canvas Display */
.canvas-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 3 / 4;
  background: #000;
  border: 4px solid var(--panel-border);
  box-shadow: inset 3px 3px 0px 0px #000;
  overflow: hidden;
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  image-rendering: pixelated; /* Crisp pixel art rendering */
}

/* Controls / Instructions */
.controls-hint {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--panel-2);
  border: 2px solid var(--panel-border);
  padding: 8px 12px;
  font-size: 11px;
  color: var(--ink-dim);
}

.pixel-btn {
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: bold;
  padding: 8px 12px;
  background: var(--panel-2);
  color: var(--ink);
  border: 3px solid var(--panel-border);
  box-shadow: inset -2px -2px 0px 0px #000, inset 2px 2px 0px 0px #444;
  cursor: pointer;
  text-align: center;
  text-transform: uppercase;
}

.pixel-btn:hover {
  background: #222;
  border-color: #666;
}

.pixel-btn.primary {
  background: var(--red);
  border-color: #ff6666;
  color: #fff;
  box-shadow: inset -2px -2px 0px 0px #880000, inset 2px 2px 0px 0px #ff9999;
}

.pixel-btn.primary:hover {
  background: var(--red-hover);
}

/* Scoreboard Footer */
.scores-bar {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.score-card {
  background: var(--panel-2);
  border: 2px solid var(--panel-border);
  padding: 8px;
  text-align: center;
}

.score-card span {
  font-size: 10px;
  color: var(--ink-dim);
  text-transform: uppercase;
  display: block;
}

.score-card strong {
  font-size: 16px;
  color: var(--gold);
}
</style>
</head>
<body>

<div class="game-container">
  
  <div class="header">
    <h1>ENDER DRAGON DODGE</h1>
    <p>Fly through the Obsidian Pillars of The End!</p>
  </div>

  <div class="canvas-wrapper">
    <canvas id="gameCanvas" width="360" height="480"></canvas>
  </div>

  <div class="controls-hint">
    <span>CONTROLS: [SPACEBAR] or [CLICK / TAP]</span>
    <button class="pixel-btn primary" id="startBtn">PLAY / RESET</button>
  </div>

  <div class="scores-bar">
    <div class="score-card">
      <span>CURRENT SCORE</span>
      <strong id="currentScore">0</strong>
    </div>
    <div class="score-card">
      <span>BEST SCORE</span>
      <strong id="bestScore">0</strong>
    </div>
  </div>

</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const currentScoreEl = document.getElementById('currentScore');
const bestScoreEl = document.getElementById('bestScore');
const startBtn = document.getElementById('startBtn');

// Load High Score
let highScore = localStorage.getItem('ender_dodge_highscore') || 0;
bestScoreEl.innerText = highScore;

// Load Custom Player Image
const playerImg = new Image();
playerImg.src = 'images/about/player.png'; // Make sure player.png is in the same folder
let playerImgLoaded = false;
playerImg.onload = () => { playerImgLoaded = true; };

// Game State
let gameState = 'START';
let score = 0;
let frames = 0;

// Your exact physics settings
const PHYSICS = {
  gravity: 0.18,
  lift: -4,
  terminalVelocity: 2.0
};

// ==========================================
// 🎨 PROCEDURAL MINECRAFT TEXTURE PATTERNS
// ==========================================

// Create Endstone Texture Pattern (higher detail: base speckle + faint cracks + mossy fleck)
const endstoneCanvas = document.createElement('canvas');
endstoneCanvas.width = 32;
endstoneCanvas.height = 32;
const esCtx = endstoneCanvas.getContext('2d');
esCtx.fillStyle = '#dbd3a0'; // Base End Stone yellow
esCtx.fillRect(0, 0, 32, 32);
const esColors = ['#c2ba85', '#aba370', '#ece4b2', '#cfc492'];
for (let i = 0; i < 140; i++) {
  esCtx.fillStyle = esColors[Math.floor(Math.random() * esColors.length)];
  esCtx.fillRect(Math.floor(Math.random() * 32), Math.floor(Math.random() * 32), 2, 2);
}
// faint hairline cracks
esCtx.strokeStyle = 'rgba(120,110,70,0.35)';
esCtx.lineWidth = 1;
for (let i = 0; i < 4; i++) {
  esCtx.beginPath();
  let sx = Math.random() * 32, sy = Math.random() * 32;
  esCtx.moveTo(sx, sy);
  esCtx.lineTo(sx + (Math.random() * 10 - 5), sy + (Math.random() * 10 - 5));
  esCtx.stroke();
}
const endstonePattern = ctx.createPattern(endstoneCanvas, 'repeat');

// Create Obsidian Texture Pattern (deeper contrast + subtle purple glints)
const obsidianCanvas = document.createElement('canvas');
obsidianCanvas.width = 32;
obsidianCanvas.height = 32;
const obCtx = obsidianCanvas.getContext('2d');
const obBase = obCtx.createLinearGradient(0, 0, 32, 32);
obBase.addColorStop(0, '#130d22');
obBase.addColorStop(1, '#0a0713');
obCtx.fillStyle = obBase;
obCtx.fillRect(0, 0, 32, 32);
const obColors = ['#1a102f', '#2a1845', '#08050e', '#3c2463', '#150f26'];
for (let i = 0; i < 130; i++) {
  obCtx.fillStyle = obColors[Math.floor(Math.random() * obColors.length)];
  obCtx.fillRect(Math.floor(Math.random() * 32), Math.floor(Math.random() * 32), 2, 2);
}
// tiny glinting flecks
for (let i = 0; i < 10; i++) {
  obCtx.fillStyle = 'rgba(216,180,254,0.55)';
  obCtx.fillRect(Math.floor(Math.random() * 32), Math.floor(Math.random() * 32), 1, 1);
}
const obsidianPattern = ctx.createPattern(obsidianCanvas, 'repeat');

// ==========================================
// ✨ AMBIENT LAYERS: starfield & parallax islands
// ==========================================

// Fixed starfield so stars don't reshuffle every frame
const stars = [];
for (let i = 0; i < 45; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * (canvas.height - 80),
    size: Math.random() < 0.15 ? 2 : 1,
    speed: 0.05 + Math.random() * 0.15,
    phase: Math.random() * Math.PI * 2
  });
}

// Distant floating End islands (silhouette shapes) for parallax depth
const islands = [];
for (let i = 0; i < 4; i++) {
  islands.push({
    x: Math.random() * canvas.width,
    y: 40 + Math.random() * 120,
    w: 60 + Math.random() * 60,
    h: 14 + Math.random() * 10,
    speed: 0.15 + Math.random() * 0.1
  });
}

function drawIslands() {
  ctx.fillStyle = 'rgba(40, 24, 66, 0.55)';
  islands.forEach(isl => {
    let ix = ((isl.x - frames * isl.speed) % (canvas.width + 160)) - 80;
    ctx.beginPath();
    ctx.ellipse(ix, isl.y, isl.w / 2, isl.h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    // small floating chunk beneath
    ctx.beginPath();
    ctx.ellipse(ix - isl.w * 0.15, isl.y + isl.h * 0.9, isl.w * 0.14, isl.h * 0.3, 0, 0, Math.PI * 2);
    ctx.fill();
  });
}

function drawStars() {
  stars.forEach(s => {
    const twinkle = 0.35 + 0.4 * Math.abs(Math.sin(frames * 0.02 * s.speed * 10 + s.phase));
    ctx.fillStyle = `rgba(233, 213, 255, ${twinkle.toFixed(2)})`;
    ctx.fillRect(s.x, s.y, s.size, s.size);
  });
}

// ==========================================
// 🐉 PLAYER
// ==========================================

let playerTrail = [];

const player = {
  x: 60,
  y: 200,
  w: 28,
  h: 28,
  velocity: 0,
  rotation: 0,

  jump() {
    this.velocity = PHYSICS.lift;
  },

  update() {
    this.velocity += PHYSICS.gravity;

    if (this.velocity > PHYSICS.terminalVelocity) {
      this.velocity = PHYSICS.terminalVelocity;
    }

    this.y += this.velocity;
    this.rotation = Math.min(Math.PI / 5, Math.max(-Math.PI / 5, (this.velocity / 4)));

    // Floor collision
    if (this.y + this.h >= canvas.height - 24) {
      this.y = canvas.height - 24 - this.h;
      gameOver();
    }

    // Ceiling collision
    if (this.y <= 0) {
      this.y = 0;
      this.velocity = 0;
    }

    // Cosmetic ender-particle trail while flying
    if (frames % 3 === 0) {
      playerTrail.push({
        x: this.x + this.w / 2,
        y: this.y + this.h / 2,
        size: Math.random() * 2.5 + 1.5,
        life: 18
      });
    }
  },

  draw() {
    // update + render trail behind the player first
    for (let i = playerTrail.length - 1; i >= 0; i--) {
      const t = playerTrail[i];
      t.life--;
      const alpha = Math.max(0, t.life / 18);
      ctx.fillStyle = `rgba(168, 85, 247, ${(alpha * 0.5).toFixed(2)})`;
      ctx.fillRect(t.x - t.size / 2, t.y - t.size / 2, t.size, t.size);
      if (t.life <= 0) playerTrail.splice(i, 1);
    }

    ctx.save();
    ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
    ctx.rotate(this.rotation);

    // soft glow beneath the player
    const glow = ctx.createRadialGradient(0, 0, 2, 0, 0, 22);
    glow.addColorStop(0, 'rgba(168, 85, 247, 0.35)');
    glow.addColorStop(1, 'rgba(168, 85, 247, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(-22, -22, 44, 44);

    if (playerImgLoaded) {
      // Draw uploaded player.png
      ctx.drawImage(playerImg, -this.w / 2, -this.h / 2, this.w, this.h);
    } else {
      // Fallback sprite: small Ender-dragon-styled flyer with flapping wings
      const flap = Math.sin(frames * 0.35) * 6;
      const wingLift = this.velocity < 0 ? 4 : -2; // wings rise a bit more on ascent

      // back wing (behind body, purple/obsidian membrane)
      ctx.fillStyle = '#2a1845';
      ctx.beginPath();
      ctx.moveTo(-4, -2);
      ctx.lineTo(-20, -10 - flap - wingLift);
      ctx.lineTo(-16, 4 - flap * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#a855f7';
      ctx.lineWidth = 1;
      ctx.stroke();

      // body (dark scaled hide)
      ctx.fillStyle = '#1c1024';
      ctx.beginPath();
      ctx.ellipse(0, 0, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // belly highlight
      ctx.fillStyle = '#3c2463';
      ctx.beginPath();
      ctx.ellipse(1, 3, 7, 4, 0, 0, Math.PI * 2);
      ctx.fill();

      // front wing (in front of body)
      ctx.fillStyle = '#3c2463';
      ctx.beginPath();
      ctx.moveTo(-2, -3);
      ctx.lineTo(-18, -6 - flap - wingLift);
      ctx.lineTo(-12, 6 - flap * 0.4);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#e9d5ff';
      ctx.lineWidth = 1;
      ctx.stroke();

      // head
      ctx.fillStyle = '#1c1024';
      ctx.beginPath();
      ctx.ellipse(10, -2, 6, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // small horns
      ctx.strokeStyle = '#0a0713';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(11, -6);
      ctx.lineTo(14, -10);
      ctx.moveTo(7, -6);
      ctx.lineTo(6, -10);
      ctx.stroke();

      // glowing purple eye
      ctx.fillStyle = '#fbc531';
      ctx.beginPath();
      ctx.arc(13, -2, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#3c1a00';
      ctx.beginPath();
      ctx.arc(13.6, -2, 0.9, 0, Math.PI * 2);
      ctx.fill();

      // tail
      ctx.strokeStyle = '#1c1024';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-10, 2);
      ctx.quadraticCurveTo(-18, 6, -22, 2 + flap * 0.3);
      ctx.stroke();
    }

    ctx.restore();
  }
};

// Pillars (Obsidian Towers)
const pillars = [];
const pillarWidth = 48;
const pillarGap = 130;

function spawnPillar() {
  const topHeight = Math.floor(Math.random() * (canvas.height - pillarGap - 120)) + 40;
  pillars.push({
    x: canvas.width,
    top: topHeight,
    bottom: canvas.height - topHeight - pillarGap,
    passed: false,
    eyeOffset: Math.random() * Math.PI * 2
  });
}

function updatePillars() {
  if (frames % 110 === 0) {
    spawnPillar();
  }

  for (let i = pillars.length - 1; i >= 0; i--) {
    let p = pillars[i];
    p.x -= 1.6;

    // Collision Check
    if (
      player.x + player.w > p.x &&
      player.x < p.x + pillarWidth &&
      (player.y < p.top || player.y + player.h > canvas.height - p.bottom)
    ) {
      gameOver();
    }

    // Score Tracking
    if (p.x + pillarWidth < player.x && !p.passed) {
      p.passed = true;
      score++;
      currentScoreEl.innerText = score;
      if (score > highScore) {
        highScore = score;
        bestScoreEl.innerText = highScore;
        localStorage.setItem('ender_dodge_highscore', highScore);
      }
    }

    if (p.x + pillarWidth < 0) {
      pillars.splice(i, 1);
    }
  }
}

function drawEnderEye(cx, cy, offset) {
  // small glowing "Eye of Ender" ornament embedded in the pillar cap
  const pulse = 0.6 + 0.4 * Math.sin(frames * 0.06 + offset);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 9);
  g.addColorStop(0, `rgba(198, 255, 190, ${0.55 * pulse})`);
  g.addColorStop(1, 'rgba(198, 255, 190, 0)');
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(cx, cy, 9, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#0d2b12';
  ctx.beginPath();
  ctx.ellipse(cx, cy, 5, 3.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = `rgba(163, 255, 138, ${pulse.toFixed(2)})`;
  ctx.beginPath();
  ctx.ellipse(cx, cy, 2.4, 2.4, 0, 0, Math.PI * 2);
  ctx.fill();
}

function drawPillars() {
  pillars.forEach(p => {
    // Fill Obsidian Texture
    ctx.fillStyle = obsidianPattern;
    ctx.fillRect(p.x, 0, pillarWidth, p.top);
    ctx.fillRect(p.x, canvas.height - p.bottom, pillarWidth, p.bottom);

    // Subtle vertical shading for depth (darker on the left edge, lighter toward center)
    const shade = ctx.createLinearGradient(p.x, 0, p.x + pillarWidth, 0);
    shade.addColorStop(0, 'rgba(0,0,0,0.35)');
    shade.addColorStop(0.5, 'rgba(0,0,0,0)');
    shade.addColorStop(1, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = shade;
    ctx.fillRect(p.x, 0, pillarWidth, p.top);
    ctx.fillRect(p.x, canvas.height - p.bottom, pillarWidth, p.bottom);

    // Beveled Pixel Border
    ctx.strokeStyle = '#3c2463';
    ctx.lineWidth = 3;
    ctx.strokeRect(p.x, 0, pillarWidth, p.top);
    ctx.strokeRect(p.x, canvas.height - p.bottom, pillarWidth, p.bottom);

    // End Crystal Base Accent (Purple Bevel Ring)
    ctx.fillStyle = '#a855f7';
    ctx.fillRect(p.x - 2, p.top - 6, pillarWidth + 4, 6);
    ctx.fillRect(p.x - 2, canvas.height - p.bottom, pillarWidth + 4, 6);

    ctx.fillStyle = '#e9d5ff';
    ctx.fillRect(p.x, p.top - 4, pillarWidth, 2);
    ctx.fillRect(p.x, canvas.height - p.bottom + 2, pillarWidth, 2);

    // Glowing Eye of Ender ornament facing the gap on each pillar cap
    drawEnderEye(p.x + pillarWidth / 2, p.top - 6, p.eyeOffset);
    drawEnderEye(p.x + pillarWidth / 2, canvas.height - p.bottom, p.eyeOffset + 1.5);
  });
}

// Background (Minecraft End Sky & Endstone Floor)
function drawBackground() {
  // End Sky Gradient (deep void with a faint nebula band)
  const skyGrad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  skyGrad.addColorStop(0, '#0d0714');
  skyGrad.addColorStop(0.55, '#160a26');
  skyGrad.addColorStop(1, '#1a0b2e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Faint nebula glow band
  const nebula = ctx.createRadialGradient(
    canvas.width * 0.7, canvas.height * 0.25, 10,
    canvas.width * 0.7, canvas.height * 0.25, 180
  );
  nebula.addColorStop(0, 'rgba(168, 85, 247, 0.12)');
  nebula.addColorStop(1, 'rgba(168, 85, 247, 0)');
  ctx.fillStyle = nebula;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawStars();
  drawIslands();

  // Floating End Fog Particles (varied size + gentle vertical drift)
  for (let i = 0; i < 16; i++) {
    let sx = (i * 43 + frames * 0.3) % canvas.width;
    let sy = ((i * 31) + Math.sin(frames * 0.01 + i) * 6) % (canvas.height - 60);
    const a = 0.12 + 0.1 * Math.sin(frames * 0.02 + i * 2);
    ctx.fillStyle = `rgba(168, 85, 247, ${a.toFixed(2)})`;
    ctx.fillRect(sx, sy, i % 3 === 0 ? 4 : 2, i % 3 === 0 ? 4 : 2);
  }

  // Endstone Ground Layer
  ctx.fillStyle = endstonePattern;
  ctx.fillRect(0, canvas.height - 24, canvas.width, 24);

  // Ground contact shadow for extra depth
  const groundShadow = ctx.createLinearGradient(0, canvas.height - 32, 0, canvas.height - 24);
  groundShadow.addColorStop(0, 'rgba(0,0,0,0.3)');
  groundShadow.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = groundShadow;
  ctx.fillRect(0, canvas.height - 32, canvas.width, 8);

  // Top Ground Bevel
  ctx.fillStyle = '#ece4b2';
  ctx.fillRect(0, canvas.height - 24, canvas.width, 3);
  ctx.fillStyle = '#a19962';
  ctx.fillRect(0, canvas.height - 21, canvas.width, 2);
}

// Death Particles
let particles = [];
let shakeFrames = 0;

function createExplosion(x, y) {
  particles = [];
  for (let i = 0; i < 36; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 5 + 1;
    particles.push({
      x: x,
      y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      size: Math.random() * 4 + 2,
      color: Math.random() > 0.5 ? '#a855f7' : '#dbd3a0',
      life: 32,
      maxLife: 32,
      spin: Math.random() * 0.3 - 0.15,
      rot: Math.random() * Math.PI
    });
  }
  shakeFrames = 14;
}

function updateParticles() {
  // central flash on impact
  if (particles.length && particles[0].life === particles[0].maxLife - 1) {
    const flash = ctx.createRadialGradient(particles[0].x, particles[0].y, 0, particles[0].x, particles[0].y, 40);
    flash.addColorStop(0, 'rgba(233, 213, 255, 0.8)');
    flash.addColorStop(1, 'rgba(233, 213, 255, 0)');
    ctx.fillStyle = flash;
    ctx.fillRect(particles[0].x - 40, particles[0].y - 40, 80, 80);
  }

  particles.forEach((pt, idx) => {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.06; // slight gravity on debris
    pt.rot += pt.spin;
    pt.life--;

    const alpha = Math.max(0, pt.life / pt.maxLife);
    ctx.save();
    ctx.translate(pt.x, pt.y);
    ctx.rotate(pt.rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = pt.color;
    ctx.fillRect(-pt.size / 2, -pt.size / 2, pt.size, pt.size);
    ctx.restore();

    if (pt.life <= 0) particles.splice(idx, 1);
  });
}

// Game Loop Functions
function resetGame() {
  player.y = 200;
  player.velocity = 0;
  pillars.length = 0;
  particles = [];
  playerTrail = [];
  shakeFrames = 0;
  score = 0;
  frames = 0;
  currentScoreEl.innerText = '0';
  gameState = 'PLAYING';
}

function gameOver() {
  if (gameState === 'GAMEOVER') return;
  gameState = 'GAMEOVER';
  createExplosion(player.x + player.w / 2, player.y + player.h / 2);
}

function drawOverlay() {
  if (gameState === 'START') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(168, 85, 247, 0.8)';
    ctx.shadowBlur = 8;
    ctx.fillStyle = '#fbc531';
    ctx.font = 'bold 15px "Courier New"';
    ctx.fillText('PRESS SPACE / TAP TO FLY', canvas.width / 2, canvas.height / 2 - 10);

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#d1d5db';
    ctx.font = '11px "Courier New"';
    ctx.fillText('Avoid Obsidian Towers', canvas.width / 2, canvas.height / 2 + 15);
  } else if (gameState === 'GAMEOVER') {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(255, 51, 51, 0.7)';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#ff3333';
    ctx.font = 'bold 22px "Courier New"';
    ctx.fillText('YOU DIED!', canvas.width / 2, canvas.height / 2 - 20);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ffffff';
    ctx.font = '14px "Courier New"';
    ctx.fillText(`Score: ${score}`, canvas.width / 2, canvas.height / 2 + 10);

    ctx.fillStyle = '#fbc531';
    ctx.font = '11px "Courier New"';
    ctx.fillText('Click "PLAY / RESET" to try again', canvas.width / 2, canvas.height / 2 + 35);
  }
}

function loop() {
  ctx.save();

  // Screen shake on death impact
  if (shakeFrames > 0) {
    const mag = (shakeFrames / 14) * 5;
    ctx.translate((Math.random() - 0.5) * mag, (Math.random() - 0.5) * mag);
    shakeFrames--;
  }

  drawBackground();

  if (gameState === 'PLAYING') {
    frames++;
    player.update();
    updatePillars();
  }

  drawPillars();
  player.draw();
  updateParticles();
  drawOverlay();

  ctx.restore();

  requestAnimationFrame(loop);
}

function handleAction() {
  if (gameState === 'START') {
    resetGame();
  } else if (gameState === 'PLAYING') {
    player.jump();
  }
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    handleAction();
  }
});

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  handleAction();
});

startBtn.addEventListener('click', () => {
  resetGame();
});

loop();

</script>
</body>
</html>
